<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Handshake representing partnership and careers at Citifrag">
  <style>
    .halo { transform-box: fill-box; transform-origin: center; animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    .ring { fill: none; stroke: #b8975a; stroke-width: 2; stroke-dasharray: 6 9; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; opacity: .75; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hand { fill: none; stroke: #001E60; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .dot { fill: #b8975a; transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    .dot.b { animation-delay: 1.5s; }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
  </style>
  <circle class="halo" cx="200" cy="150" r="86" fill="#eaf0fb"/>
  <circle class="ring" cx="200" cy="150" r="104"/>
  <circle class="dot" cx="96" cy="150" r="4"/>
  <circle class="dot b" cx="304" cy="150" r="4"/>
  <g class="hands" transform="translate(128,78) scale(6)">
    <path class="hand" d="m11 17 2 2a1 1 0 1 0 3-3"/>
    <path class="hand" d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/>
    <path class="hand" d="m21 3 1 11h-2"/>
    <path class="hand" d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/>
    <path class="hand" d="M3 4h8"/>
  </g>
</svg>
